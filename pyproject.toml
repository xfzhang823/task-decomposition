[project]
name = "task-decomposition"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "black>=26.5.1",
    "pydantic>=2.13.5",
    "pylance>=12.0.0",
    "pylint>=4.1.1",
]

[project.optional-dependencies]
openai = [
    "openai>=1.68.0",
]
gemini = [
    "google-genai>=1.0.0",
]
deepseek = [
    "openai>=1.68.0",
]
providers = [
    "openai>=1.68.0",
    "google-genai>=1.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires an explicitly configured external provider",
]
