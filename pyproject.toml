[project]
name = "task-transmorph"
version = "0.1.0"
description = "Task Transmorph: task decomposition, AI transformation decomposition, and human-effort impact estimation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.5",
]

[project.optional-dependencies]
openai = [
    "openai>=1.68.0",
]
gemini = [
    "google-genai>=2.33.0",
]
deepseek = [
    "openai>=1.68.0",
]
providers = [
    "openai>=1.68.0",
    "google-genai>=2.33.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "black>=26.10.0",
    "build>=1.2.2",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "notebook>=7.6.3",
    "pandas>=2.3.3",
    "pylance>=13.0.0",
    "pylint>=4.1.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires an explicitly configured external provider",
]
